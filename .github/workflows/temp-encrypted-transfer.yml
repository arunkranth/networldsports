name: Temporary Encrypted Evidence Transfer

on:
  push:
    branches: [main]
    paths:
      - '.transfer-trigger'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          curl -fsS --retry 5 --retry-delay 2             'https://meshmerce-poc-evidence-text-575411322722.asia-south2.run.app/bundle.enc.b64'             -o transfer/bundle.enc.b64
          curl -fsS --retry 5 --retry-delay 2             'https://meshmerce-poc-evidence-text-575411322722.asia-south2.run.app/key.enc.b64'             -o transfer/key.enc.b64
          test -s transfer/bundle.enc.b64
          test -s transfer/key.enc.b64
          wc -c transfer/*

      - name: Upload ciphertext artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meshmerce-encrypted-evidence-transfer
          path: transfer
          if-no-files-found: error
          retention-days: 1
